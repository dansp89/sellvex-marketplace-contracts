          maxLength: 500
          minLength: 1
          type: string
      required:
        - reason
      type: object
    TemplateListOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/NotificationTemplate"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    UpdateStoreInputBody:
      additionalProperties: false
      properties:
        default_locale:
          description: Canonical BCP 47 tag.
          maxLength: 35
          minLength: 2
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
        timezone:
          description: IANA time zone.
          maxLength: 64
          minLength: 1
          type: string
      type: object
    WebhookDelivery:
      additionalProperties: false
      properties:
        attempts:
          format: int64
          type: integer
        created_at:
          format: date-time
          type: string
        event_id:
          format: uuid
          type: string
        event_type:
          type: string
        id:
          format: uuid
          type: string
        last_error:
          type: string
        last_status_code:
          format: int64
          type: integer
        next_attempt_at:
          format: date-time
          type: string
        status:
          enum:
            - pending
            - delivering
            - succeeded
            - failed
            - dead_lettered
          type: string
        subscription_id:
          format: uuid
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - subscription_id
        - event_id
        - event_type
        - status
        - attempts
        - created_at
        - updated_at
      type: object
    WebhookSubscription:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        description:
          type: string
        endpoint:
          type: string
        event_types:
          items:
            type: string
          type:
            - array
            - "null"
        id:
          format: uuid
          type: string
        secret:
          description: "Returned once, on creation. Store it: it is never shown again."
          type: string
        status:
          enum:
            - active
            - deleted
          type: string
        store_id:
          format: uuid
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - store_id
        - endpoint
        - event_types
        - status
        - created_at
        - updated_at
      type: object
    WithdrawInputBody:
      additionalProperties: false
      properties:
        buyer_reference:
          maxLength: 200
          minLength: 1
          type: string
        purpose:
          enum:
            - marketing
          type: string
      required:
        - buyer_reference
        - purpose
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      description: Access token from the approved OpenID Connect provider.
      scheme: bearer
      type: http
