components:
  schemas:
    AdjustInputBody:
      additionalProperties: false
      properties:
        delta:
          description: Change of on hand stock; never zero.
          format: int64
          maximum: 1000000000
          minimum: -1000000000
          type: integer
        reason:
          maxLength: 500
          minLength: 3
          type: string
        variant_id:
          format: uuid
          type: string
      required:
        - variant_id
        - delta
        - reason
      type: object
    Applied:
      additionalProperties: false
      properties:
        amount:
          format: int64
          type: integer
        code:
          type: string
        name:
          type: string
        promotion_id:
          format: uuid
          type: string
        residue:
          description: Apportionment method, when the discount was over the whole basket.
          type: string
      required:
        - promotion_id
        - name
        - amount
      type: object
    AppliedPromotion:
      additionalProperties: false
      properties:
        amount:
          format: int64
          type: integer
        code:
          type: string
        lines:
          additionalProperties:
            format: int64
            type: integer
          type: object
        name:
          type: string
        promotion_id:
          format: uuid
          type: string
        residue:
          description: Apportionment method, when the discount was over the whole basket (DEC-FIN-003).
          type: string
        version:
          format: int64
          type: integer
      required:
        - promotion_id
        - version
        - name
        - amount
        - lines
      type: object
    Availability:
      additionalProperties: false
      properties:
        available:
          format: int64
          type: integer
        variant_id:
          format: uuid
          type: string
      required:
        - variant_id
        - available
      type: object
    AvailabilityInputBody:
      additionalProperties: false
      properties:
        variant_ids:
          items:
            type: string
          maxItems: 200
          minItems: 1
          type:
            - array
            - "null"
      required:
        - variant_ids
      type: object
    AvailabilityOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Availability"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    BasketLine:
      additionalProperties: false
      properties:
        product_id:
          format: uuid
          type: string
        quantity:
          format: int64
          maximum: 1000000
          minimum: 1
          type: integer
        unit_price:
          format: int64
          minimum: 0
          type: integer
        variant_id:
          format: uuid
          type: string
      required:
        - variant_id
        - product_id
        - quantity
        - unit_price
      type: object
    Cart:
      additionalProperties: false
      properties:
        abandon_at:
          description: When the cart is abandoned if left unchanged. Any change pushes it out.
          format: date-time
          type: string
        buyer_reference:
          type: string
        channel_id:
          format: uuid
          type: string
        checkout_id:
          format: uuid
          type: string
        coupon_code:
          type: string
        created_at:
          format: date-time
          type: string
        currency:
          type: string
        discount_amount:
          description: What promotions grant now.
          format: int64
          type: integer
        expire_at:
          description: When the cart expires, counted from creation.
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        lines:
          items:
            $ref: "#/components/schemas/Line"
          type:
            - array
            - "null"
        promotion_ruleset_version:
          description: The store's promotion ruleset the discounts were computed against.
          format: int64
          type: integer
        promotions:
          description: Promotions applied now, with the discount each granted.
          items:
            $ref: "#/components/schemas/Applied"
          type:
            - array
            - "null"
        ready:
          description: True when every line is sellable, priced and in stock right now.
          type: boolean
        status:
          enum:
            - open
            - checking_out
            - checked_out
            - abandoned
            - expired
            - merged
          type: string
        store_id:
          format: uuid
          type: string
        subtotal_amount:
          description: "Sum of priced lines before discounts, in minor units. Informative: checkout recalculates."
          format: int64
          type: integer
        subtotal_currency:
          type: string
        total_amount:
          description: Subtotal minus discounts.
          format: int64
          type: integer
        updated_at:
          format: date-time
          type: string
        version:
          format: int64
          type: integer
      required:
        - id
        - store_id
        - currency
        - status
        - lines
        - subtotal_amount
        - subtotal_currency
        - discount_amount
        - total_amount
        - promotions
        - promotion_ruleset_version
        - ready
        - created_at
        - updated_at
        - version
      type: object
    Channel:
      additionalProperties: false
      properties:
        code:
          type: string
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        kind:
          enum:
            - marketplace
            - store
          type: string
        name:
          type: string
        status:
          enum:
            - active
            - inactive
          type: string
        store_id:
          description: Absent for a marketplace channel, which every store sells on.
          format: uuid
          type: string
        updated_at:
          format: date-time
          type: string
        version:
          format: int64
          type: integer
      required:
        - id
        - kind
        - code
        - name
        - status
        - created_at
        - updated_at
        - version
      type: object
    CheckResult:
      additionalProperties: false
      properties:
        duration_ms:
          description: Probe duration in milliseconds.
          format: int64
          minimum: 0
          type: integer
        name:
          description: Dependency name.
          type: string
        status:
          description: Probe outcome.
          enum:
            - up
            - down
          type: string
      required:
        - name
        - status
        - duration_ms
      type: object
    ConsideredPromotion:
      additionalProperties: false
      properties:
        amount:
          format: int64
          type: integer
        detail:
          type: string
        name:
          type: string
        outcome:
          type: string
        priority:
          format: int64
          type: integer
        promotion_id:
          format: uuid
          type: string
        version:
          format: int64
          type: integer
      required:
        - promotion_id
        - version
        - name
        - priority
        - outcome
      type: object
    CouponInputBody:
      additionalProperties: false
      properties:
        code:
          description: Upper-cased. Whether it is worth anything is answered by the promotions in the cart's view.
          maxLength: 40
          minLength: 2
          type: string
      required:
        - code
      type: object
    CreateInputBody:
      additionalProperties: false
      properties:
        description:
          maxLength: 10000
          type: string
        title:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - title
      type: object
    CreateInputBody1:
      additionalProperties: false
      properties:
        currency:
          maxLength: 3
          minLength: 3
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
        priority:
          format: int64
          maximum: 1000
          minimum: 0
          type: integer
        valid_from:
          format: date-time
          type: string
        valid_until:
          format: date-time
          type: string
      required:
        - name
        - currency
      type: object
    CreateInputBody2:
      additionalProperties: false
      properties:
        budget_amount:
          description: Total discount the promotion may grant, in minor units.
          format: int64
          minimum: 1
          type: integer
        code:
          description: Coupon code; upper-cased.
          maxLength: 40
          type: string
        conditions:
          items:
            $ref: "#/components/schemas/PromotionCondition"
          maxItems: 10
          type:
            - array
            - "null"
        currency:
          maxLength: 3
          minLength: 3
          type: string
        effect:
          $ref: "#/components/schemas/PromotionEffect"
        exclusive:
          description: "Applies alone: nothing before, nothing after."
          type: boolean
        max_uses:
          format: int64
          minimum: 1
          type: integer
        max_uses_per_buyer:
          description: How often one buyer may redeem it; a basket with no buyer never gets a promotion that has this.
          format: int64
          minimum: 1
          type: integer
        name:
          maxLength: 100
          minLength: 1
          type: string
        priority:
          description: Higher applies first.
          format: int64
          maximum: 1000
          minimum: 0
          type: integer
        valid_from:
          format: date-time
          type: string
        valid_until:
          format: date-time
          type: string
      required:
        - name
        - effect
        - currency
      type: object
    CreateInputBody3:
      additionalProperties: false
      properties:
        buyer_reference:
          description: Opaque reference of the buyer in the caller's system. The customer account model is DEC-ID-001.
          maxLength: 200
          minLength: 1
          type: string
        channel_id:
          description: The sales channel, one of the store's sellable channels. Copied to the order.
          format: uuid
          type: string
        currency:
          maxLength: 3
          minLength: 3
          type: string
      required:
        - currency
      type: object
    CreateWarehouseInputBody:
      additionalProperties: false
      properties:
        name:
          maxLength: 200
          minLength: 1
          type: string
        priority:
          description: Lower is tried first by the priority strategy. Defaults to 100.
          format: int64
          maximum: 1000
          minimum: 0
          type: integer
      required:
        - name
      type: object
    EditInputBody:
      additionalProperties: false
      properties:
        description:
          maxLength: 10000
          type: string
        expected_version:
          description: Refuse the change with 409 when the product has another version.
          format: int64
          minimum: 1
          type: integer
        title:
          maxLength: 200
          minLength: 1
          type: string
      type: object
    EditInputBody1:
      additionalProperties: false
      properties:
        expected_version:
          format: int64
          minimum: 1
          type: integer
        name:
          maxLength: 200
          minLength: 1
          type: string
        priority:
          format: int64
          maximum: 1000
          minimum: 0
          type: integer
        set_validity:
          description: When true, valid_from and valid_until replace both bounds; omitted bounds become open.
          type: boolean
        valid_from:
          format: date-time
          type: string
        valid_until:
          format: date-time
          type: string
      type: object
    EntriesOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Entry"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    Entry:
      additionalProperties: false
      properties:
        price_amount:
          description: Minor units of price_currency (ADR-0011).
          format: int64
          type: integer
        price_currency:
          type: string
        price_list_id:
          format: uuid
          type: string
        updated_at:
          format: date-time
          type: string
        variant_id:
          format: uuid
          type: string
      required:
        - price_list_id
        - variant_id
        - price_amount
        - price_currency
        - updated_at
      type: object
    EvaluateInputBody:
      additionalProperties: false
      properties:
        channel_id:
          format: uuid
          type: string
        coupon_code:
          maxLength: 40
          type: string
        currency:
          maxLength: 3
          minLength: 3
          type: string
        lines:
          items:
            $ref: "#/components/schemas/BasketLine"
          maxItems: 100
          minItems: 1
          type:
            - array
            - "null"
      required:
        - currency
        - lines
      type: object
    Evaluation:
      additionalProperties: false
      properties:
        applied:
          items:
            $ref: "#/components/schemas/AppliedPromotion"
          type:
            - array
            - "null"
        considered:
          items:
            $ref: "#/components/schemas/ConsideredPromotion"
          type:
            - array
            - "null"
        currency:
          type: string
        discounts:
          additionalProperties:
            format: int64
            type: integer
          description: Discount per variant, in minor units.
          type: object
        ruleset_version:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
      required:
        - currency
        - discounts
        - total
        - applied
        - considered
        - ruleset_version
      type: object
    FieldError:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, such as body.name or query.limit.
          type: string
        message:
          description: Human-readable explanation.
          type: string
      required:
        - message
      type: object
    Intent:
      additionalProperties: false
      properties:
        deduplicated:
          type: boolean
        expires_at:
          format: date-time
          type: string
        media:
          $ref: "#/components/schemas/Media"
        upload_url:
          description: PUT exactly the declared bytes here with the declared Content-Type, before expires_at. Absent when the store already holds this content.
          type: string
      required:
        - media
        - deduplicated
      type: object
    IntentInputBody:
      additionalProperties: false
      properties:
        checksum_sha256:
          maxLength: 64
          minLength: 64
          pattern: ^[0-9a-fA-F]{64}$
          type: string
        content_type:
          description: One of the accepted types (DEC-MEDIA-004). Verified against the content at finalize.
          maxLength: 100
          minLength: 3
          type: string
        size:
          format: int64
          minimum: 1
          type: integer
      required:
        - content_type
        - size
        - checksum_sha256
      type: object
    Line:
      additionalProperties: false
      properties:
        added_at:
          format: date-time
          type: string
        available:
          format: int64
          type: integer
        discount_amount:
          description: What promotions take off this line now.
          format: int64
          type: integer
        issues:
          description: not_sellable, unpriced, ambiguous_price or insufficient_stock.
          items:
            type: string
          type:
            - array
            - "null"
        line_total_amount:
          format: int64
          type: integer
        line_total_currency:
          type: string
        price_list_id:
          format: uuid
          type: string
        price_list_version:
          format: int64
          type: integer
        product_title:
          type: string
        quantity:
          format: int64
          type: integer
        sku:
          type: string
        title:
          type: string
        unit_price_amount:
          description: Minor units of unit_price_currency.
          format: int64
          type: integer
        unit_price_currency:
          type: string
        variant_id:
          format: uuid
          type: string
      required:
        - variant_id
        - quantity
        - available
        - issues
        - added_at
      type: object
    ListOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Channel"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    ListOutputBody1:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Product"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    ListOutputBody2:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Promotion"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    ListOutputBody3:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Summary"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    ListOutputBody4:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Media"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    ListOutputBody5:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Review"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    LivenessOutputBody:
      additionalProperties: false
      properties:
        status:
          description: Always ok while the process can serve requests.
          enum:
            - ok
          type: string
      required:
        - status
      type: object
    Media:
      additionalProperties: false
      properties:
        attachment:
          description: True when the URL is served for download, never inline.
          type: boolean
        checksum_sha256:
          type: string
        class:
          enum:
            - image
            - video
            - document
          type: string
        content_type:
          description: The type detected from the content once uploaded; the declared one before.
          type: string
        created_at:
          format: date-time
          type: string
        expires_at:
          description: Deadline of a pending upload.
          format: date-time
          type: string
        height:
          format: int64
          type: integer
        id:
          format: uuid
          type: string
        rejection:
          type: string
        scan_status:
          type: string
        size:
          format: int64
          type: integer
        status:
          enum:
            - pending_upload
            - uploaded
            - scanning
            - ready
            - published
            - archived
            - deleted
            - rejected
          type: string
        store_id:
          format: uuid
          type: string
        updated_at:
          format: date-time
          type: string
        url:
          description: Immutable public URL when published, a short-lived signed URL when private; absent when nothing is servable.
          type: string
        version:
          format: int64
          type: integer
        width:
          format: int64
          type: integer
      required:
        - id
        - store_id
        - status
        - class
        - content_type
        - size
        - checksum_sha256
        - created_at
        - updated_at
        - version
      type: object
    MergeInputBody:
      additionalProperties: false
      properties:
        source_cart_id:
          description: The cart folded into this one; it is left merged.
          format: uuid
          type: string
      required:
        - source_cart_id
      type: object
    PageOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/PriceList"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    Position:
      additionalProperties: false
      properties:
        available:
          description: on_hand minus reserved.
          format: int64
          type: integer
        on_hand:
          format: int64
          type: integer
        reserved:
          format: int64
          type: integer
        updated_at:
          format: date-time
          type: string
        variant_id:
          format: uuid
          type: string
        warehouse_id:
          format: uuid
          type: string
      required:
        - warehouse_id
        - variant_id
        - on_hand
        - reserved
        - available
        - updated_at
      type: object
    PositionsOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Position"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    PriceList:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        currency:
          description: ISO 4217. Every price of the list is in it.
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        priority:
          description: 0 to 1000. The highest applicable priority wins; ties make the price ambiguous.
          format: int64
          type: integer
        status:
          enum:
            - draft
            - active
            - archived
          type: string
        store_id:
          format: uuid
          type: string
        updated_at:
          format: date-time
          type: string
        valid_from:
          format: date-time
          type: string
        valid_until:
          description: Exclusive.
          format: date-time
          type: string
        version:
          description: Changes with the list and with every price in it.
          format: int64
          type: integer
      required:
        - id
        - store_id
        - name
        - currency
        - priority
        - status
        - created_at
        - updated_at
        - version
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: Stable machine-readable error code.
          type: string
        detail:
          description: Explanation specific to this occurrence.
          type: string
        errors:
          description: Invalid input locations.
          items:
            $ref: "#/components/schemas/FieldError"
          type:
            - array
            - "null"
        instance:
          description: URI identifying this occurrence.
          type: string
        request_id:
          description: Request identifier for support and tracing.
          type: string
        status:
          description: HTTP status code.
          format: int64
          type: integer
        title:
          description: Short summary of the problem type.
          type: string
        type:
          description: URI identifying the problem type.
          type: string
      required:
        - type
        - title
        - status
        - code
      type: object
    Product:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        description:
          type: string
        id:
          format: uuid
          type: string
        published_at:
          format: date-time
          type: string
        status:
          enum:
            - draft
            - published
            - archived
          type: string
        store_id:
          format: uuid
          type: string
        title:
          type: string
        updated_at:
          format: date-time
          type: string
        variants:
          description: Present when reading a single product.
          items:
            $ref: "#/components/schemas/Variant"
          type:
            - array
            - "null"
        version:
          format: int64
          type: integer
      required:
        - id
        - store_id
        - title
        - description
        - status
        - created_at
        - updated_at
        - version
      type: object
    Promotion:
      additionalProperties: false
      properties:
        budget_amount:
          format: int64
          type: integer
        code:
          type: string
        conditions:
          items:
            $ref: "#/components/schemas/PromotionCondition"
          type:
            - array
            - "null"
        created_at:
          format: date-time
          type: string
        currency:
          type: string
        effect:
          $ref: "#/components/schemas/PromotionEffect"
        exclusive:
          type: boolean
        id:
          format: uuid
          type: string
        max_uses:
          format: int64
          type: integer
        max_uses_per_buyer:
          description: How often one buyer may redeem it; absent means only the overall limit applies.
          format: int64
          type: integer
        name:
          type: string
        priority:
          format: int64
          type: integer
        spent:
          format: int64
          type: integer
        status:
          enum:
            - active
            - paused
            - archived
          type: string
        store_id:
          format: uuid
          type: string
        updated_at:
          format: date-time
          type: string
        uses:
          format: int64
          type: integer
        valid_from:
          format: date-time
          type: string
        valid_until:
          format: date-time
          type: string
        version:
          format: int64
          type: integer
      required:
        - id
        - store_id
        - name
        - priority
        - exclusive
        - conditions
        - effect
        - currency
        - uses
        - spent
        - valid_from
        - status
        - created_at
        - updated_at
        - version
      type: object
    PromotionCondition:
      additionalProperties: false
      properties:
        amount:
          description: For min_subtotal, in minor units.
          format: int64
          minimum: 0
          type: integer
        ids:
          description: For variant_in, product_in and channel_is.
          items:
            format: uuid
            type: string
          maxItems: 200
          type:
            - array
            - "null"
        kind:
          enum:
            - min_subtotal
            - variant_in
            - product_in
            - min_quantity
            - channel_is
            - coupon
          type: string
        quantity:
          description: For min_quantity, over the matching lines.
          format: int64
          minimum: 0
          type: integer
      required:
        - kind
      type: object
    PromotionEffect:
      additionalProperties: false
      properties:
        amount:
          description: Minor units.
          format: int64
          minimum: 0
          type: integer
        bps:
          description: "Basis points: 1000 is 10%."
          format: int64
          maximum: 10000
          minimum: 0
          type: integer
        kind:
          description: Order-level effects are blocked until DEC-FIN-003 fixes the residue method.
          enum:
            - percent_off_line
            - amount_off_unit
            - percent_off_order
            - amount_off_order
          type: string
      required:
        - kind
      type: object
    QuoteInputBody:
      additionalProperties: false
      properties:
        currency:
          maxLength: 3
          minLength: 3
          type: string
        variant_ids:
          items:
            type: string
          maxItems: 200
          minItems: 1
          type:
            - array
            - "null"
      required:
        - currency
        - variant_ids
      type: object
    QuoteLine:
      additionalProperties: false
      properties:
        price_amount:
          format: int64
          type: integer
        price_currency:
          type: string
        price_list_id:
          format: uuid
          type: string
        price_list_version:
          format: int64
          type: integer
        variant_id:
          format: uuid
          type: string
      required:
        - variant_id
        - price_amount
        - price_currency
        - price_list_id
        - price_list_version
      type: object
    QuoteOutputBody:
      additionalProperties: false
      properties:
        ambiguous:
          description: Variants whose highest-priority applicable lists tie; they have no price.
          items:
            type: string
          type:
            - array
            - "null"
        at:
          description: Instant the validity of lists was evaluated at.
          format: date-time
          type: string
        currency:
          type: string
        prices:
          items:
            $ref: "#/components/schemas/QuoteLine"
          type:
            - array
            - "null"
        unpriced:
          description: Variants without an applicable price.
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - currency
        - at
        - prices
        - unpriced
        - ambiguous
      type: object
    ReadinessBody:
      additionalProperties: false
      properties:
        checks:
          description: One entry per configured dependency.
          items:
            $ref: "#/components/schemas/CheckResult"
          type:
            - array
            - "null"
        status:
          description: ready when every dependency is up.
          enum:
            - ready
            - not_ready
          type: string
      required:
        - status
        - checks
      type: object
    RejectInputBody:
      additionalProperties: false
      properties:
        reason:
          description: Why it was refused; the buyer can be shown this.
          maxLength: 500
          minLength: 3
          type: string
      required:
        - reason
      type: object
    Reservation:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        lines:
          items:
            $ref: "#/components/schemas/ReservationLine"
          type:
            - array
            - "null"
        reference:
          type: string
        status:
          enum:
            - active
            - confirmed
            - released
            - expired
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - reference
        - status
        - expires_at
        - created_at
        - updated_at
        - lines
      type: object
    ReservationLine:
      additionalProperties: false
      properties:
        quantity:
          format: int64
          type: integer
        variant_id:
          format: uuid
          type: string
        warehouse_id:
          format: uuid
          type: string
      required:
        - variant_id
        - warehouse_id
        - quantity
      type: object
    Review:
      additionalProperties: false
      properties:
        body:
          type: string
        buyer_reference:
          type: string
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        moderated_at:
          format: date-time
          type: string
        moderated_by:
          type: string
        moderation_reason:
          type: string
        product_id:
          format: uuid
          type: string
        rating:
          format: int64
          maximum: 5
          minimum: 1
          type: integer
        seller_order_id:
          description: The purchase behind it, when the review names one.
          format: uuid
          type: string
        status:
          enum:
            - pending
            - published
            - rejected
            - withdrawn
          type: string
        store_id:
          format: uuid
          type: string
        title:
          type: string
      required:
        - id
        - store_id
        - product_id
        - buyer_reference
        - rating
        - status
        - created_at
      type: object
    SearchHit:
      additionalProperties: false
      properties:
        product_id:
          format: uuid
          type: string
        score:
          format: double
          type: number
        title:
          type: string
      required:
        - product_id
        - title
        - score
      type: object
    SearchOutputBody:
      additionalProperties: false
      properties:
        index_lag_ms:
          description: "How far behind the projection was: what this answer may not know yet. Search never gives transactional truth (02 §Search)."
          format: int64
          type: integer
        items:
          items:
            $ref: "#/components/schemas/SearchHit"
          type:
            - array
            - "null"
        total:
          description: How many documents matched, as the engine counted them.
          format: int64
          type: integer
      required:
        - items
        - total
        - index_lag_ms
      type: object
    SetInputBody:
      additionalProperties: false
      properties:
        price_amount:
          description: Minor units of the list currency.
          format: int64
          maximum: 9007199254740991
          minimum: 0
          type: integer
      required:
        - price_amount
      type: object
    SetInputBody1:
      additionalProperties: false
      properties:
        quantity:
          format: int64
          maximum: 1000000
          minimum: 1
          type: integer
      required:
        - quantity
      type: object
    StorefrontCart:
      additionalProperties: false
      properties:
        currency:
          type: string
        discount_amount:
          format: int64
          type: integer
        id:
          format: uuid
          type: string
        lines:
          items:
            $ref: "#/components/schemas/StorefrontCartLine"
          type:
            - array
            - "null"
        ready:
          type: boolean
        status:
          type: string
        subtotal_amount:
          format: int64
          type: integer
        total_amount:
          format: int64
          type: integer
      required:
        - id
        - currency
        - status
        - lines
        - subtotal_amount
        - discount_amount
        - total_amount
        - ready
      type: object
    StorefrontCartInputBody:
      additionalProperties: false
      properties:
        currency:
          description: ISO 4217, uppercase.
          maxLength: 3
          minLength: 3
          type: string
      required:
        - currency
      type: object
    StorefrontCartLine:
      additionalProperties: false
      properties:
        line_amount:
          format: int64
          type: integer
        product_title:
          type: string
        quantity:
          format: int64
          type: integer
        sku:
          type: string
        title:
          type: string
        unit_amount:
          format: int64
          type: integer
        variant_id:
          format: uuid
          type: string
      required:
        - variant_id
        - sku
        - title
        - product_title
        - quantity
      type: object
    StorefrontItemInputBody:
      additionalProperties: false
      properties:
        quantity:
          description: Zero removes the line.
          format: int64
          minimum: 0
          type: integer
      required:
        - quantity
      type: object
    StorefrontListOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/StorefrontProduct"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    StorefrontProduct:
      additionalProperties: false
      properties:
        description:
          type: string
        id:
          format: uuid
          type: string
        title:
          type: string
        variants:
          items:
            $ref: "#/components/schemas/StorefrontVariant"
          type:
            - array
            - "null"
      required:
        - id
        - title
        - description
      type: object
    StorefrontVariant:
      additionalProperties: false
      properties:
        amount:
          format: int64
          type: integer
        currency:
          type: string
        id:
          format: uuid
          type: string
        sku:
          type: string
        title:
          type: string
      required:
        - id
        - sku
        - title
      type: object
    SubmitInputBody:
      additionalProperties: false
      properties:
        body:
          maxLength: 4000
          type: string
        buyer_reference:
          description: The account writing it. It must have a delivered order of this product.
          maxLength: 200
          minLength: 1
          type: string
        product_id:
          format: uuid
          type: string
        rating:
          format: int64
          maximum: 5
          minimum: 1
          type: integer
        title:
          maxLength: 120
          type: string
      required:
        - product_id
        - buyer_reference
        - rating
      type: object
    Summary:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        currency:
          type: string
        id:
          format: uuid
          type: string
        status:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - currency
        - status
        - created_at
        - updated_at
      type: object
    UsageOutputBody:
      additionalProperties: false
      properties:
        quota_bytes:
          format: int64
          type: integer
        used_bytes:
          format: int64
          type: integer
      required:
        - used_bytes
        - quota_bytes
      type: object
    Variant:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        product_id:
          format: uuid
          type: string
        sku:
          type: string
        title:
          type: string
      required:
        - id
        - product_id
        - sku
        - title
        - created_at
      type: object
    VariantInputBody:
      additionalProperties: false
      properties:
        sku:
          description: Unique in the store, case-sensitive.
          maxLength: 64
          minLength: 1
          type: string
        title:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - sku
        - title
      type: object
    Warehouse:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        priority:
          format: int64
          type: integer
        status:
          enum:
            - active
            - inactive
          type: string
        store_id:
          format: uuid
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - store_id
        - name
        - priority
        - status
        - created_at
        - updated_at
      type: object
    WarehousesOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Warehouse"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    WithdrawInputBody:
      additionalProperties: false
      properties:
        buyer_reference:
          description: The account that wrote it. Only its author withdraws a review.
          maxLength: 200
          minLength: 1
          type: string
      required:
        - buyer_reference
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      description: Access token from the approved OpenID Connect provider.
      scheme: bearer
      type: http
info:
  title: Sellvex Commerce API
  version: 0.1.0
openapi: 3.1.0
paths:
  /v1/health/liveness:
    get:
      description: Reports that the process can serve requests. Does not probe dependencies.
      operationId: health.liveness.get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Get liveness
      tags:
        - health
  /v1/health/readiness:
    get:
      description: Probes every configured dependency. Returns 503 when any dependency is down.
      operationId: health.readiness.get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessBody"
          description: OK
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessBody"
          description: One or more dependencies are down.
      summary: Get readiness
      tags:
        - health
  /v1/storefronts/{store_id}/carts:
    post:
      description: "An anonymous cart. Whoever holds its id holds the cart: most sales begin before anybody logs in, and requiring an account to hold a basket loses the sale. It carries no personal data until a checkout asks for some."
      operationId: storefront.carts.create
      parameters:
        - in: path
          name: store_id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorefrontCartInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontCart"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Start a cart
      tags:
        - storefront
      x-sellvex-cache-policy: none
      x-sellvex-latency-budget-p99-ms: 300
      x-sellvex-max-database-queries: 6
      x-sellvex-performance-class: transactional-write
      x-sellvex-replica-allowed: false
  /v1/storefronts/{store_id}/carts/{cart_id}:
    get:
      description: The cart, priced. Whoever holds the id may read it.
      operationId: storefront.carts.get
      parameters:
        - in: path
          name: store_id
          required: true
          schema:
            format: uuid
            type: string
        - in: path
          name: cart_id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontCart"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Read a cart
      tags:
        - storefront
      x-sellvex-cache-policy: none
      x-sellvex-latency-budget-p99-ms: 150
      x-sellvex-max-database-queries: 3
      x-sellvex-performance-class: tenant-read
      x-sellvex-replica-allowed: false
  /v1/storefronts/{store_id}/carts/{cart_id}/items/{variant_id}:
    put:
      description: Sets the quantity of one variant, replacing what was there. Zero removes the line. The price is the store's at the moment the cart is read, not at the moment the item went in.
      operationId: storefront.cartItems.set
      parameters:
        - in: path
          name: store_id
          required: true
          schema:
            format: uuid
            type: string
        - in: path
          name: cart_id
          required: true
          schema:
            format: uuid
            type: string
        - in: path
          name: variant_id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorefrontItemInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontCart"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Put a variant in a cart
      tags:
        - storefront
      x-sellvex-cache-policy: none
      x-sellvex-latency-budget-p99-ms: 300
      x-sellvex-max-database-queries: 8
      x-sellvex-performance-class: transactional-write
      x-sellvex-replica-allowed: false
  /v1/storefronts/{store_id}/products:
    get:
      description: "The published catalogue of one store, for a buyer with no credential. Only published products appear: a draft is the seller's working copy and has never been offered to anybody."
      operationId: storefront.products.list
      parameters:
        - in: path
          name: store_id
          required: true
          schema:
            format: uuid
            type: string
        - explode: false
          in: query
          name: cursor
          schema:
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Browse a shop
      tags:
        - storefront
      x-sellvex-cache-policy: shared
      x-sellvex-latency-budget-p99-ms: 50
      x-sellvex-max-database-queries: 4
      x-sellvex-performance-class: public-read
      x-sellvex-replica-allowed: true
      x-sellvex-replica-max-lag-ms: 5000
  /v1/storefronts/{store_id}/products/{product_id}:
    get:
      description: "One published product of a store, with its variants. A product that is not published is absent rather than forbidden: a buyer learns nothing from the difference, and the difference would say which drafts exist."
      operationId: storefront.products.get
      parameters:
        - in: path
          name: store_id
          required: true
          schema:
            format: uuid
            type: string
        - in: path
          name: product_id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontProduct"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Read a product
      tags:
        - storefront
      x-sellvex-cache-policy: shared
      x-sellvex-latency-budget-p99-ms: 50
      x-sellvex-max-database-queries: 4
      x-sellvex-performance-class: public-read
      x-sellvex-replica-allowed: true
      x-sellvex-replica-max-lag-ms: 5000
  /v1/stores/{store_id}/carts:
    get:
      operationId: carts.carts.list
      parameters:
        - in: path
          name: store_id
          required: true
          schema:
            format: uuid
            type: string
        - explode: false
          in: query
          name: cursor
          schema:
            maxLength: 512
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            maximum: 200
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOutputBody3"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - bearer: []
      summary: List carts
      tags:
        - carts
      x-sellvex-actor-types:
        - platform_operator
        - store_member
        - api_client
        - extension
      x-sellvex-cache-policy: private
      x-sellvex-latency-budget-p99-ms: 150
      x-sellvex-max-database-queries: 4
      x-sellvex-performance-class: authenticated-read
      x-sellvex-permission: carts.carts.read
      x-sellvex-replica-allowed: false
      x-sellvex-scope: store
    post:
      operationId: carts.carts.create
      parameters:
        - description: Unique key for this mutation. Retrying with the same key and payload returns the original response.
          in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
        - in: path
          name: store_id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInputBody3"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Create cart
      tags:
        - carts
      x-sellvex-actor-types:
        - platform_operator
        - store_member
        - api_client
        - extension
      x-sellvex-cache-policy: none
      x-sellvex-latency-budget-p99-ms: 300
      x-sellvex-max-database-queries: 8
      x-sellvex-performance-class: transactional-write
      x-sellvex-permission: carts.carts.write
      x-sellvex-replica-allowed: false
      x-sellvex-scope: store
  /v1/stores/{store_id}/carts/{cart_id}:
    get:
      description: Returns the cart with prices, discounts and availability recalculated now. Nothing is reserved until checkout.
      operationId: carts.carts.get
      parameters:
        - in: path
          name: store_id
          required: true
          schema:
            format: uuid
            type: string
        - in: path
          name: cart_id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
