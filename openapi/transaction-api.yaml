info:
  title: Sellvex Transaction API
  version: 0.1.0
openapi: 3.1.0
paths:
  /v1/commissions/rules:
    get:
      operationId: commissions.rules.list
      parameters:
        - explode: false
          in: query
          name: cursor
          schema:
            maxLength: 512
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            maximum: 200
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOutputBody2"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - bearer: []
      summary: List platform commission rules
      tags:
        - commissions
      x-sellvex-actor-types:
        - platform_operator
      x-sellvex-cache-policy: private
      x-sellvex-latency-budget-p99-ms: 150
      x-sellvex-max-database-queries: 2
      x-sellvex-performance-class: authenticated-read
      x-sellvex-permission: commissions.rules.read
      x-sellvex-replica-allowed: false
      x-sellvex-scope: platform
    post:
      description: "A global rule, or one fixing a category or a channel. Two active rules fixing the same dimensions over intersecting windows are refused: the table never contradicts itself (DEC-COM-002). Rates are DEC-COM-001; none is seeded."
      operationId: commissions.rules.create
      parameters:
        - description: Unique key for this mutation. Retrying with the same key and payload returns the original response.
          in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionRule"
          description: Created
        "400":
          content:
