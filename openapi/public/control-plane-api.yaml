components:
  schemas:
    AddDomainInputBody:
      additionalProperties: false
      properties:
        domain:
          description: A domain the store owns, such as loja-do-joao.com.br.
          maxLength: 253
          minLength: 4
          type: string
      required:
        - domain
      type: object
    AddressesOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/CustomerAddress"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    CheckResult:
      additionalProperties: false
      properties:
        duration_ms:
          description: Probe duration in milliseconds.
          format: int64
          minimum: 0
          type: integer
        name:
          description: Dependency name.
          type: string
        status:
          description: Probe outcome.
          enum:
            - up
            - down
          type: string
      required:
        - name
        - status
        - duration_ms
      type: object
    ClaimSlugInputBody:
      additionalProperties: false
      properties:
        slug:
          description: The label under the platform's domain, such as loja-do-joao.
          maxLength: 63
          minLength: 3
          type: string
      required:
        - slug
      type: object
    ConnectInputBody:
      additionalProperties: false
      properties:
        adapter:
          description: One of the adapters this deployment composed.
          pattern: ^[a-z][a-z0-9_]{1,63}$
          type: string
        label:
          description: What to recognise this connection by.
          maxLength: 100
          type: string
        secret:
          description: The credential. Stored encrypted and never returned.
          maxLength: 8192
          minLength: 1
          type: string
      required:
        - adapter
        - secret
      type: object
    Connection:
      additionalProperties: false
      properties:
        adapter:
          type: string
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        cursor:
          description: Where the last sync stopped, as the adapter wrote it.
          type: string
        health:
          description: What the last check found. An observation, not a promise.
          enum:
            - unknown
            - up
            - down
          type: string
        id:
          format: uuid
          type: string
        label:
          type: string
        last_checked_at:
          format: date-time
          type: string
        last_error:
          type: string
        last_synced_at:
          format: date-time
          type: string
        status:
          enum:
            - active
            - paused
            - disconnected
          type: string
        store_id:
          format: uuid
          type: string
      required:
        - id
        - store_id
        - adapter
        - status
        - health
        - created_at
        - created_by
      type: object
    ConnectorBody:
      additionalProperties: false
      properties:
        label:
          description: What to recognise these settings by.
          maxLength: 100
          type: string
        settings:
          additionalProperties:
            type: string
          description: Field name to value. Merged into what is stored; unknown fields are refused.
          type: object
      required:
        - settings
      type: object
    ConnectorField:
      additionalProperties: false
      properties:
        doc:
          type: string
        kind:
          description: A secret is stored encrypted and never returned.
          enum:
            - text
            - secret
            - int
            - bool
          type: string
        name:
          type: string
        required:
          type: boolean
      required:
        - name
        - kind
        - required
        - doc
      type: object
    ConnectorListOutputBody:
      additionalProperties: false
      properties:
        available:
          items:
            $ref: "#/components/schemas/ConnectorSchema"
          type:
            - array
            - "null"
        items:
          items:
            $ref: "#/components/schemas/ConnectorSettings"
          type:
            - array
            - "null"
      required:
        - items
        - available
      type: object
    ConnectorSchema:
      additionalProperties: false
      properties:
        adapter:
          type: string
        capability:
          description: "The port this adapter serves: notifications, shipping or search."
          type: string
        display_name:
          type: string
        doc:
          type: string
        fields:
          items:
            $ref: "#/components/schemas/ConnectorField"
          type:
            - array
            - "null"
        store_scoped:
          description: Whether a store may hold its own settings, or only the platform.
          type: boolean
      required:
        - adapter
        - capability
        - display_name
        - doc
        - store_scoped
        - fields
      type: object
    ConnectorSettings:
      additionalProperties: false
      properties:
        adapter:
          type: string
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        enabled:
          type: boolean
        health:
          enum:
            - unknown
            - up
            - down
          type: string
        id:
          format: uuid
          type: string
        label:
          type: string
        last_checked_at:
          format: date-time
          type: string
        last_error:
          type: string
        missing:
          description: Required fields still to be filled. A connector missing anything is not used.
          items:
            type: string
          type:
            - array
            - "null"
        secrets_set:
          description: The secret fields that hold a value. Their values are never returned.
          items:
            type: string
          type:
            - array
            - "null"
        settings:
          additionalProperties:
            type: string
          description: The settings that are not secret, as they were registered.
          type: object
        store_id:
          description: Absent for the platform's own settings.
          format: uuid
          type: string
        updated_at:
          format: date-time
          type: string
        updated_by:
          type: string
        usable:
          description: "Whether the platform will build an adapter from these settings: enabled and complete."
          type: boolean
      required:
        - id
        - adapter
        - settings
        - secrets_set
        - enabled
        - usable
        - health
        - created_at
        - created_by
        - updated_at
        - updated_by
      type: object
    ContactListOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/StoreContactMessage"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    CourierSignup:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        invite_token:
          description: "The token of a store's invite (FR-COUR-006): the courier joins that store's own fleet as pending, and the CDL of the store's organization reviews them. A token used, cancelled or expired is refused with 422 couriers.invite_invalid before the login is made."
          maxLength: 100
          type: string
        name:
          maxLength: 120
          minLength: 2
          type: string
        password:
          description: "At least the installation's minimum: 6 in local and CI, 12 elsewhere."
          maxLength: 256
          minLength: 6
          type: string
        phone:
          maxLength: 30
          type: string
        terms_version:
          description: The version of the courier's terms the person accepted. Required.
          maxLength: 64
          minLength: 1
          type: string
      required:
        - name
        - email
        - password
        - terms_version
      type: object
    CreateTemplateInputBody:
      additionalProperties: false
      properties:
        body:
          description: Text with {{snake_case}} placeholders; nothing else is interpreted.
          maxLength: 20000
          minLength: 1
          type: string
        category:
          description: Marketing deliveries are blocked until DEC-PRIV-003 defines consent.
          enum:
            - transactional
            - marketing
          type: string
        channel:
          enum:
            - email
            - sms
            - push
          type: string
        key:
          maxLength: 64
          minLength: 2
          type: string
        locale:
          maxLength: 16
          minLength: 2
          type: string
        subject:
          maxLength: 200
          type: string
      required:
        - key
        - channel
        - category
        - locale
        - body
      type: object
    CustomerAccount:
      additionalProperties: false
      properties:
        actor_type:
          type: string
        email:
          type: string
        name:
          type: string
        phone:
          type: string
        subject:
          type: string
        terms_accepted_at:
          format: date-time
          type: string
        terms_version:
          type: string
      required:
        - subject
        - actor_type
      type: object
    CustomerAddress:
      additionalProperties: false
      properties:
        address:
          $ref: "#/components/schemas/RecipientAddress"
        created_at:
          format: date-time
          type: string
        default:
          type: boolean
        id:
          format: uuid
          type: string
        label:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - label
        - address
        - default
        - created_at
        - updated_at
      type: object
    CustomerAddressInput:
      additionalProperties: false
      properties:
        address:
          $ref: "#/components/schemas/RecipientAddress"
        default:
          type: boolean
        label:
          description: "What the buyer calls it: Casa, Trabalho."
          maxLength: 60
          minLength: 1
          type: string
      required:
        - label
        - address
      type: object
    CustomerSignup:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        marketing_consent:
          description: The person agreed to receive offers from the store named in store_id; recorded by the privacy module.
          type: boolean
        name:
          maxLength: 120
          minLength: 2
          type: string
        password:
          description: "At least the installation's minimum: 6 in local and CI, 12 elsewhere."
          maxLength: 256
          minLength: 6
          type: string
        phone:
          maxLength: 30
          type: string
        store_id:
          description: The shop where the person signed up. Marketing consent is given to this store and no other.
          format: uuid
          type: string
        terms_version:
          description: The version of the terms of use the person accepted. Required.
          maxLength: 64
          minLength: 1
          type: string
      required:
        - name
        - email
        - password
        - terms_version
      type: object
    CustomerUpdateInputBody:
      additionalProperties: false
      properties:
        name:
          maxLength: 120
          minLength: 2
          type: string
        phone:
          description: Empty removes it.
          maxLength: 30
          type: string
      type: object
    Delivery:
      additionalProperties: false
      properties:
        attempts:
          format: int64
          type: integer
        category:
          type: string
        channel:
          type: string
        created_at:
          format: date-time
          type: string
        history:
          description: Present when reading a single delivery.
          items:
            $ref: "#/components/schemas/DeliveryAttempt"
          type:
            - array
            - "null"
        id:
          format: uuid
          type: string
        last_error:
          type: string
        next_attempt_at:
          format: date-time
          type: string
        provider:
          type: string
        provider_ref:
          type: string
        recipient:
          description: Masked.
          type: string
        status:
          enum:
            - queued
            - sent
            - failed
            - dead_lettered
            - suppressed
          type: string
        store_id:
          format: uuid
          type: string
        template_key:
          type: string
        template_version:
          format: int64
          type: integer
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - store_id
        - template_key
        - template_version
        - channel
        - category
        - recipient
        - status
        - attempts
        - created_at
        - updated_at
      type: object
    DeliveryAttempt:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        error:
          type: string
        number:
          format: int64
          type: integer
        outcome:
          type: string
        provider:
          type: string
        provider_ref:
          type: string
      required:
        - number
        - provider
        - outcome
        - at
      type: object
    DeliveryListOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Delivery"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    FieldError:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, such as body.name or query.limit.
          type: string
        message:
          description: Human-readable explanation.
          type: string
      required:
        - message
      type: object
    Hostname:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        hostname:
          type: string
        id:
          format: uuid
          type: string
        kind:
          enum:
            - subdomain
            - custom
          type: string
        last_checked_at:
          description: Possession is re-checked, not assumed.
          format: date-time
          type: string
        serving:
          description: Whether the edge answers on this name.
          type: boolean
        state:
          enum:
            - pending_verification
            - verified
            - active
            - failing
            - suspended
            - removed
          type: string
        store_id:
          format: uuid
          type: string
        verification_token:
          description: Publish as a TXT record on _sellvex-challenge.<domain>.
          type: string
        verification_token_expires_at:
          format: date-time
          type: string
        verified_at:
          format: date-time
          type: string
      required:
        - id
        - store_id
        - hostname
        - kind
        - state
        - serving
        - created_at
      type: object
    HostnameListOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Hostname"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    ListOutputBody4:
      additionalProperties: false
      properties:
        adapters:
          description: What this deployment can connect to.
          items:
            type: string
          type:
            - array
            - "null"
        items:
          items:
            $ref: "#/components/schemas/Connection"
          type:
            - array
            - "null"
      required:
        - items
        - adapters
      type: object
    LivenessOutputBody:
      additionalProperties: false
      properties:
        status:
          description: Always ok while the process can serve requests.
          enum:
            - ok
          type: string
      required:
        - status
      type: object
    MyEmailChange:
      additionalProperties: false
      properties:
        current_password:
          maxLength: 256
          minLength: 1
          type: string
        email:
          format: email
          maxLength: 254
          type: string
      required:
        - email
        - current_password
      type: object
    MyEmailConfirmation:
      additionalProperties: false
      properties:
        token:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - token
      type: object
    MyEmailConfirmed:
      additionalProperties: false
      properties:
        email:
          type: string
      required:
        - email
      type: object
    MyPasswordChange:
      additionalProperties: false
      properties:
        current_password:
          maxLength: 256
          minLength: 1
          type: string
        new_password:
          description: At least min_password_length characters.
          maxLength: 256
          minLength: 6
          type: string
        new_password_confirmation:
          maxLength: 256
          minLength: 1
          type: string
      required:
        - current_password
        - new_password
        - new_password_confirmation
      type: object
    MyProfile:
      additionalProperties: false
      properties:
        actor_type:
          type: string
        email:
          type: string
        min_password_length:
          description: "Shortest password accepted: 6 in local and CI, 12 in staging and production."
          format: int64
          type: integer
        name:
          type: string
        pending_email:
          description: A new e-mail waiting for confirmation, when there is one.
          type: string
        subject:
          type: string
      required:
        - subject
        - name
        - email
        - actor_type
        - min_password_length
      type: object
    MyProfileUpdate:
      additionalProperties: false
      properties:
        name:
          maxLength: 120
          minLength: 2
          type: string
      required:
        - name
      type: object
    NotificationTemplate:
      additionalProperties: false
      properties:
        body:
          type: string
        category:
          enum:
            - transactional
            - marketing
          type: string
        channel:
          enum:
            - email
            - sms
            - push
          type: string
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        key:
          type: string
        locale:
          type: string
        store_id:
          format: uuid
          type: string
        subject:
          type: string
        variables:
          description: Placeholders the text uses; every delivery must supply them.
          items:
            type: string
          type:
            - array
            - "null"
        version:
          format: int64
          type: integer
      required:
        - id
        - store_id
        - key
        - channel
        - category
        - locale
        - body
        - variables
        - version
        - created_at
      type: object
    PasswordRecoveryFinishInputBody:
      additionalProperties: false
      properties:
        new_password:
          maxLength: 256
          minLength: 6
          type: string
        token:
          maxLength: 200
          minLength: 20
          type: string
      required:
        - token
        - new_password
      type: object
    PasswordRecoveryStartInputBody:
      additionalProperties: false
      properties:
        email:
          maxLength: 254
          type: string
      required:
        - email
      type: object
    PlatformBootstrapRequest:
      additionalProperties: false
      properties:
        code:
          description: The installation code (SELLVEX_BOOTSTRAP_TOKEN on the server).
          maxLength: 256
          minLength: 1
          type: string
        email:
          description: The login of the account, in the identity provider.
          format: email
          maxLength: 254
          type: string
        name:
          maxLength: 120
          minLength: 2
          type: string
        password:
          description: Goes to the identity provider; the platform never keeps it. At least 6 characters in local and CI, 12 in staging and production (see min_password_length).
          maxLength: 256
          minLength: 6
          type: string
      required:
        - code
        - name
        - email
        - password
      type: object
    PlatformBootstrapResult:
      additionalProperties: false
      properties:
        email:
          type: string
        role:
          type: string
        subject:
          type: string
      required:
        - email
        - subject
        - role
      type: object
    PlatformBootstrapStatus:
      additionalProperties: false
      properties:
        min_password_length:
          description: "Shortest password accepted: 6 in local and CI, 12 in staging and production."
          format: int64
          type: integer
        open:
          description: True while the platform has no operator. Says nothing else.
          type: boolean
      required:
        - open
        - min_password_length
      type: object
    PlatformBrand:
      additionalProperties: false
      properties:
        accent_color:
          type: string
        accent_color_dark:
          type: string
        address:
          type: string
        app_store:
          type: string
        domain:
          type: string
        facebook:
          type: string
        favicon_url:
          type: string
        google_play:
          type: string
        instagram:
          type: string
        legal_name:
          type: string
        logo_dark_url:
          type: string
        logo_display:
          description: both, logo, name or none; empty at version 0.
          type: string
        logo_svg:
          type: string
        logo_url:
          type: string
        name:
          type: string
        primary_color:
          type: string
        primary_color_dark:
          type: string
        sender_email:
          type: string
        sender_name:
          type: string
        short_name:
          type: string
        site_url:
          type: string
        support_email:
          type: string
        support_phone:
          type: string
        tagline:
          type: string
        tax_id:
          type: string
        updated_at:
          description: RFC 3339; empty at version 0.
          type: string
        version:
          description: Increments on every write; 0 before any brand was written.
          format: int64
          type: integer
        whatsapp:
          type: string
      required:
        - version
        - updated_at
        - name
        - short_name
        - tagline
        - domain
        - site_url
        - legal_name
        - tax_id
        - address
        - support_email
        - support_phone
        - sender_name
        - sender_email
        - logo_svg
        - logo_url
        - logo_dark_url
        - favicon_url
        - logo_display
        - primary_color
        - accent_color
        - primary_color_dark
        - accent_color_dark
        - instagram
        - facebook
        - whatsapp
        - app_store
        - google_play
      type: object
    PreferenceInputBody:
      additionalProperties: false
      properties:
        category:
          enum:
            - transactional
            - marketing
          type: string
        opted_out:
          type: boolean
        recipient:
          maxLength: 320
          minLength: 1
          type: string
      required:
        - recipient
        - category
        - opted_out
      type: object
    PreferenceOutputBody:
      additionalProperties: false
      properties:
        category:
          type: string
        opted_out:
          type: boolean
        recipient:
          description: Masked.
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - recipient
        - category
        - opted_out
        - updated_at
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: Stable machine-readable error code.
          type: string
        detail:
          description: Explanation specific to this occurrence.
          type: string
        errors:
          description: Invalid input locations.
          items:
            $ref: "#/components/schemas/FieldError"
          type:
            - array
            - "null"
        instance:
          description: URI identifying this occurrence.
          type: string
        request_id:
          description: Request identifier for support and tracing.
          type: string
        status:
          description: HTTP status code.
          format: int64
          type: integer
        title:
          description: Short summary of the problem type.
          type: string
        type:
          description: URI identifying the problem type.
          type: string
      required:
        - type
        - title
        - status
        - code
      type: object
    PushDevice:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        last_seen_at:
          format: date-time
          type: string
        platform:
          enum:
            - android
            - ios
            - web
          type: string
      required:
        - id
        - platform
        - created_at
        - last_seen_at
      type: object
    PushDevicesOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/PushDevice"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    PushRegisterInputBody:
      additionalProperties: false
      properties:
        platform:
          enum:
            - android
            - ios
            - web
          type: string
        token:
          description: The registration token the push provider gave the app.
          maxLength: 4096
          minLength: 20
          type: string
      required:
        - platform
        - token
      type: object
    ReadinessBody:
      additionalProperties: false
      properties:
        checks:
          description: One entry per configured dependency.
          items:
            $ref: "#/components/schemas/CheckResult"
          type:
            - array
            - "null"
        status:
          description: ready when every dependency is up.
          enum:
            - ready
            - not_ready
          type: string
      required:
        - status
        - checks
      type: object
    RecipientAddress:
      additionalProperties: false
      properties:
        country:
          description: ISO 3166-1 alpha-2.
          maxLength: 2
          minLength: 2
          type: string
        latitude:
          description: Optional; with it the distance of a local delivery is measured instead of estimated.
          format: double
          maximum: 90
          minimum: -90
          type: number
        line1:
          maxLength: 200
          minLength: 1
          type: string
        line2:
          maxLength: 200
          type: string
        locality:
          maxLength: 200
          minLength: 1
          type: string
        longitude:
          format: double
          maximum: 180
          minimum: -180
          type: number
        postal_code:
          maxLength: 20
          minLength: 1
          type: string
        recipient:
          maxLength: 200
          type: string
        region:
          maxLength: 200
          type: string
      required:
        - country
        - postal_code
        - locality
        - line1
      type: object
    RequestInputBody:
      additionalProperties: false
      properties:
        channel:
          enum:
            - email
            - sms
            - push
          type: string
        key:
          maxLength: 64
          minLength: 2
          type: string
        locale:
          maxLength: 16
          minLength: 2
          type: string
        recipient:
          description: The address on the channel. Never echoed back in full.
          maxLength: 320
          minLength: 1
          type: string
        variables:
          additionalProperties:
            type: string
          description: One value per placeholder of the template.
          type: object
      required:
        - key
        - channel
        - locale
        - recipient
      type: object
    Store:
      additionalProperties: false
      properties:
        account_id:
          format: uuid
          type: string
        cell_id:
          description: Present once the store is placed.
          type: string
        country:
          description: ISO 3166-1 alpha-2.
          type: string
        created_at:
          format: date-time
          type: string
        default_currency:
          description: ISO 4217.
          type: string
        default_locale:
          description: BCP 47 tag.
          type: string
        home_region:
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        organization_id:
          format: uuid
          type: string
        paused:
          description: The merchant closed its own shop.
          type: boolean
        selling:
          description: Whether the store may take new orders. Both conditions must be clear.
          type: boolean
        status:
          enum:
            - provisioning
            - active
          type: string
        suspended:
          description: The platform stopped this store. Only the platform lifts it.
          type: boolean
        suspended_at:
          format: date-time
          type: string
        suspended_by_level:
          enum:
            - platform
            - organization
          type: string
        suspended_reason:
          description: The detail of the block, in words.
          type: string
        suspended_reason_code:
          enum:
            - registration_irregularity
            - documents_or_tax
            - customer_complaints
            - suspected_fraud
            - policy_violation
            - merchant_request
            - other
          type: string
        timezone:
          description: IANA time zone.
          type: string
        updated_at:
          format: date-time
          type: string
        version:
          format: int64
          type: integer
      required:
        - id
        - organization_id
        - account_id
        - name
        - country
        - default_locale
        - timezone
        - default_currency
        - home_region
        - status
        - selling
        - paused
        - suspended
        - created_at
        - updated_at
        - version
      type: object
    StoreContactMessage:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        email:
          type: string
        id:
          format: uuid
          type: string
        message:
          type: string
        name:
          type: string
        phone:
          type: string
        subject:
          type: string
        user_agent:
          type: string
      required:
        - id
        - name
        - email
        - subject
        - message
        - created_at
      type: object
    StorefrontContactInputBody:
      additionalProperties: false
      properties:
        email:
          maxLength: 254
          type: string
        message:
          maxLength: 5000
          minLength: 10
          type: string
        name:
          maxLength: 120
          minLength: 1
          type: string
        phone:
          maxLength: 30
          type: string
        subject:
          maxLength: 200
          minLength: 1
          type: string
        website:
          description: Leave empty. A form hides this field; anything in it marks the message as a robot's.
          maxLength: 200
          type: string
      required:
        - name
        - email
        - subject
        - message
      type: object
    StorefrontNewsletterConfirmInputBody:
      additionalProperties: false
      properties:
        token:
          description: The token of the link mailed by the subscription.
          maxLength: 200
          minLength: 1
          type: string
      required:
        - token
      type: object
    StorefrontNewsletterInputBody:
      additionalProperties: false
      properties:
        email:
          maxLength: 254
          type: string
        text_version:
          description: Which wording of the opt-in the visitor saw.
          maxLength: 64
          minLength: 1
          type: string
      required:
        - email
        - text_version
      type: object
    StorefrontUnsubscribeInputBody:
      additionalProperties: false
      properties:
        email:
          maxLength: 254
          type: string
      required:
        - email
      type: object
    TemplateListOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/NotificationTemplate"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    UpdateStoreInputBody:
      additionalProperties: false
      properties:
        default_locale:
          description: Canonical BCP 47 tag.
          maxLength: 35
          minLength: 2
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
        timezone:
          description: IANA time zone.
          maxLength: 64
          minLength: 1
          type: string
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      description: Access token from the approved OpenID Connect provider.
      scheme: bearer
      type: http
info:
  title: Sellvex Control Plane API
  version: 0.3.0
openapi: 3.1.0
paths:
  /v1/couriers/signup:
    post:
      description: "The public signup of the courier delivery app (shown to users as <brand> Delivery) (FR-COUR-003): the login is created in the identity provider with the actor type courier, through the same adapter as a buyer's. The courier then fills their profile (PUT /v1/courier/me) and sends their documents, and a network reviews them. An e-mail that already has an account is refused with 409 identity.signup_login_exists."
      operationId: identity.couriers.signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourierSignup"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAccount"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Create my courier account
      tags:
        - identity
      x-sellvex-cache-policy: none
      x-sellvex-latency-budget-p99-ms: 1000
      x-sellvex-max-database-queries: 8
      x-sellvex-performance-class: control-plane
      x-sellvex-replica-allowed: false
  /v1/customers/me:
    get:
      operationId: identity.customers.me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAccount"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Read my buyer account
      tags:
        - identity
      x-sellvex-actor-types:
        - customer
        - courier
      x-sellvex-cache-policy: private
      x-sellvex-latency-budget-p99-ms: 150
      x-sellvex-max-database-queries: 2
      x-sellvex-performance-class: authenticated-read
      x-sellvex-permission: identity.profile.read
      x-sellvex-replica-allowed: false
      x-sellvex-scope: platform
      x-sellvex-self: true
    patch:
      operationId: identity.customers.update
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdateInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAccount"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Change my name or phone
      tags:
        - identity
      x-sellvex-actor-types:
        - customer
        - courier
      x-sellvex-cache-policy: none
      x-sellvex-latency-budget-p99-ms: 300
      x-sellvex-max-database-queries: 4
      x-sellvex-performance-class: transactional-write
      x-sellvex-permission: identity.profile.write
      x-sellvex-replica-allowed: false
      x-sellvex-scope: platform
      x-sellvex-self: true
  /v1/customers/me/addresses:
    get:
      operationId: identity.customerAddresses.list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressesOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - bearer: []
      summary: List my addresses
      tags:
        - identity
      x-sellvex-actor-types:
        - customer
        - courier
      x-sellvex-cache-policy: private
      x-sellvex-latency-budget-p99-ms: 150
      x-sellvex-max-database-queries: 1
      x-sellvex-performance-class: authenticated-read
      x-sellvex-permission: identity.profile.read
      x-sellvex-replica-allowed: false
      x-sellvex-scope: platform
      x-sellvex-self: true
    post:
      description: The first address saved is the default. At most 20.
      operationId: identity.customerAddresses.create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerAddressInput"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAddress"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Save an address
      tags:
        - identity
      x-sellvex-actor-types:
        - customer
        - courier
      x-sellvex-cache-policy: none
      x-sellvex-latency-budget-p99-ms: 300
      x-sellvex-max-database-queries: 4
      x-sellvex-performance-class: transactional-write
      x-sellvex-permission: identity.profile.write
      x-sellvex-replica-allowed: false
      x-sellvex-scope: platform
      x-sellvex-self: true
  /v1/customers/me/addresses/{address_id}:
    delete:
      operationId: identity.customerAddresses.delete
      parameters:
        - in: path
          name: address_id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Remove an address
      tags:
        - identity
      x-sellvex-actor-types:
        - customer
        - courier
      x-sellvex-cache-policy: none
      x-sellvex-latency-budget-p99-ms: 300
      x-sellvex-max-database-queries: 2
      x-sellvex-performance-class: transactional-write
      x-sellvex-permission: identity.profile.write
      x-sellvex-replica-allowed: false
      x-sellvex-scope: platform
      x-sellvex-self: true
    put:
      operationId: identity.customerAddresses.update
      parameters:
        - in: path
          name: address_id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerAddressInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAddress"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Replace an address
      tags:
        - identity
      x-sellvex-actor-types:
        - customer
        - courier
      x-sellvex-cache-policy: none
      x-sellvex-latency-budget-p99-ms: 300
      x-sellvex-max-database-queries: 4
      x-sellvex-performance-class: transactional-write
      x-sellvex-permission: identity.profile.write
      x-sellvex-replica-allowed: false
      x-sellvex-scope: platform
      x-sellvex-self: true
  /v1/customers/password-recovery:
    post:
      description: Mails a one-time link, good for an hour, when the e-mail is a buyer's or a courier's account. The answer is 202 whether or not the account exists, so nobody learns who has one; at most three links an hour are sent.
      operationId: identity.passwordRecovery.start
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRecoveryStartInputBody"
        required: true
      responses:
        "202":
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Ask for a password recovery link
      tags:
        - identity
      x-sellvex-cache-policy: none
      x-sellvex-latency-budget-p99-ms: 1000
      x-sellvex-max-database-queries: 3
      x-sellvex-performance-class: control-plane
      x-sellvex-replica-allowed: false
  /v1/customers/password-recovery/finish:
    post:
      description: Spends the link and sets the new password. A link used, expired or unknown is refused with 422 identity.recovery_invalid.
      operationId: identity.passwordRecovery.finish
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRecoveryFinishInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Set a new password with the recovery link
      tags:
        - identity
      x-sellvex-cache-policy: none
      x-sellvex-latency-budget-p99-ms: 1000
      x-sellvex-max-database-queries: 2
      x-sellvex-performance-class: control-plane
      x-sellvex-replica-allowed: false
  /v1/customers/signup:
    post:
      description: Creates the login in the identity provider, with the actor type customer, and keeps the version of the terms accepted. Marketing consent needs the shop it is given to, so here it is refused with 422 identity.consent_needs_store; the shop's own route records it. An e-mail that already has an account is refused with 409 identity.signup_login_exists.
      operationId: identity.customers.signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerSignup"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAccount"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Create my buyer account
      tags:
        - identity
      x-sellvex-cache-policy: none
      x-sellvex-latency-budget-p99-ms: 1000
      x-sellvex-max-database-queries: 6
      x-sellvex-performance-class: control-plane
      x-sellvex-replica-allowed: false
  /v1/health/liveness:
    get:
      description: Reports that the process can serve requests. Does not probe dependencies.
      operationId: health.liveness.get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Get liveness
      tags:
        - health
  /v1/health/readiness:
    get:
      description: Probes every configured dependency. Returns 503 when any dependency is down.
      operationId: health.readiness.get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessBody"
          description: OK
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessBody"
          description: One or more dependencies are down.
      summary: Get readiness
      tags:
        - health
  /v1/me:
    get:
      description: The caller's own name and e-mail, as the identity provider holds them, and a pending e-mail change if any.
      operationId: identity.me.get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - bearer: []
      summary: My account
      tags:
        - identity
      x-sellvex-actor-types:
        - platform_operator
        - store_member
        - courier
        - customer
      x-sellvex-cache-policy: private
      x-sellvex-latency-budget-p99-ms: 150
      x-sellvex-max-database-queries: 2
      x-sellvex-performance-class: authenticated-read
      x-sellvex-permission: identity.profile.read
      x-sellvex-replica-allowed: false
      x-sellvex-scope: platform
      x-sellvex-self: true
    patch:
      description: Changes the caller's display name in the identity provider. Tokens already issued keep the old name until they expire; sign in again to carry the new one.
      operationId: identity.me.update
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MyProfileUpdate"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Change my name
      tags:
        - identity
      x-sellvex-actor-types:
        - platform_operator
        - store_member
        - courier
        - customer
      x-sellvex-cache-policy: none
      x-sellvex-latency-budget-p99-ms: 300
      x-sellvex-max-database-queries: 4
      x-sellvex-performance-class: transactional-write
      x-sellvex-permission: identity.profile.write
      x-sellvex-replica-allowed: false
      x-sellvex-scope: platform
      x-sellvex-self: true
  /v1/me/email:
    post:
      description: Records a pending change and mails a confirmation link to the new address; the old one is told. The e-mail changes only when the link is opened, within 24 hours. Requires the current password. A new request replaces the pending one.
      operationId: identity.me.email
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MyEmailChange"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"
          description: Accepted
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Change my e-mail
      tags:
        - identity
      x-sellvex-actor-types:
        - platform_operator
        - store_member
        - courier
        - customer
      x-sellvex-cache-policy: none
      x-sellvex-latency-budget-p99-ms: 300
      x-sellvex-max-database-queries: 6
      x-sellvex-performance-class: transactional-write
      x-sellvex-permission: identity.profile.write
      x-sellvex-replica-allowed: false
      x-sellvex-scope: platform
      x-sellvex-self: true
  /v1/me/email/confirm:
    post:
      description: Applies the e-mail change the link's token names, once. An unknown, used or expired token answers 404.
      operationId: identity.me.emailConfirm
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MyEmailConfirmation"
