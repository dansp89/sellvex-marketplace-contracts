components:
  schemas:
    Account:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        organization_id:
          format: uuid
          type: string
        updated_at:
          format: date-time
          type: string
        version:
          format: int64
          type: integer
      required:
        - id
        - organization_id
        - name
        - created_at
        - updated_at
        - version
      type: object
    AccountsOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Account"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    AddDomainInputBody:
      additionalProperties: false
      properties:
        domain:
          description: A domain the store owns, such as loja-do-joao.com.br.
          maxLength: 253
          minLength: 4
          type: string
      required:
        - domain
      type: object
    ApprovalListOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ApprovalRequest"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    ApprovalRequest:
      additionalProperties: false
      properties:
        approved_by:
          type: string
        expires_at:
          type: string
        id:
          format: uuid
          type: string
        kind:
          type: string
        reason:
          type: string
        requested_at:
          type: string
        requested_by:
          type: string
        status:
          type: string
        store_id:
          format: uuid
          type: string
        target:
          type: string
      required:
        - id
        - kind
        - target
        - reason
        - status
        - requested_by
        - requested_at
        - expires_at
      type: object
    AssignPlanInputBody:
      additionalProperties: false
      properties:
        plan_id:
          description: The plan this store is on. Its values apply to every key the store does not override.
          pattern: ^[a-z][a-z0-9_]*$
          type: string
        reason:
          maxLength: 500
          minLength: 1
          type: string
      required:
        - plan_id
        - reason
      type: object
    AsyncJob:
      additionalProperties: false
      properties:
        attempts:
          format: int64
          type: integer
        created_at:
          format: date-time
          type: string
        detail:
          type: string
        expires_at:
          format: date-time
          type: string
        failure_code:
          type: string
        history:
          description: Present when reading a single job.
          items:
            $ref: "#/components/schemas/JobAttempt"
          type:
            - array
            - "null"
        id:
          format: uuid
          type: string
        kind:
          type: string
        progress:
          description: Percentage of completion the runner reported.
          format: int64
          type: integer
        result_ref:
          description: Where the artifact is; absent once retention lapses.
          type: string
        status:
          enum:
            - queued
            - running
            - succeeded
            - failed
            - cancelled
            - expired
          type: string
        store_id:
          format: uuid
          type: string
        submitted_by:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - store_id
        - kind
        - status
        - progress
        - submitted_by
        - attempts
        - expires_at
        - created_at
        - updated_at
      type: object
    CancelInputBody:
      additionalProperties: false
      properties:
        reason:
          description: Why the work is no longer wanted.
          maxLength: 500
          type: string
      required:
        - reason
      type: object
    Cell:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        id:
          type: string
        region:
          type: string
        status:
          enum:
            - provisioning
            - active
            - draining
            - retired
          type: string
        updated_at:
          format: date-time
          type: string
        version:
          format: int64
          type: integer
      required:
        - id
        - region
        - status
        - created_at
        - updated_at
        - version
      type: object
    CellsOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Cell"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    CheckResult:
      additionalProperties: false
      properties:
        duration_ms:
          description: Probe duration in milliseconds.
          format: int64
          minimum: 0
          type: integer
        name:
          description: Dependency name.
          type: string
        status:
          description: Probe outcome.
          enum:
            - up
            - down
          type: string
      required:
        - name
        - status
        - duration_ms
      type: object
    ClaimSlugInputBody:
      additionalProperties: false
      properties:
        slug:
          description: The label under the platform's domain, such as loja-do-joao.
          maxLength: 63
          minLength: 3
          type: string
      required:
        - slug
      type: object
    ConnectInputBody:
      additionalProperties: false
      properties:
        adapter:
          description: One of the adapters this deployment composed.
          pattern: ^[a-z][a-z0-9_]{1,63}$
          type: string
        label:
          description: What to recognise this connection by.
          maxLength: 100
          type: string
        secret:
          description: The credential. Stored encrypted and never returned.
          maxLength: 8192
          minLength: 1
          type: string
      required:
        - adapter
        - secret
      type: object
    Connection:
      additionalProperties: false
      properties:
        adapter:
          type: string
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        cursor:
          description: Where the last sync stopped, as the adapter wrote it.
          type: string
        health:
          description: What the last check found. An observation, not a promise.
          enum:
            - unknown
            - up
            - down
          type: string
        id:
          format: uuid
          type: string
        label:
          type: string
        last_checked_at:
          format: date-time
          type: string
        last_error:
          type: string
        last_synced_at:
          format: date-time
          type: string
        status:
          enum:
            - active
            - paused
            - disconnected
          type: string
        store_id:
          format: uuid
          type: string
      required:
        - id
        - store_id
        - adapter
        - status
        - health
        - created_at
        - created_by
      type: object
    ConnectorBody:
      additionalProperties: false
      properties:
        label:
          description: What to recognise these settings by.
          maxLength: 100
          type: string
        settings:
          additionalProperties:
            type: string
          description: Field name to value. Merged into what is stored; unknown fields are refused.
          type: object
      required:
        - settings
      type: object
    ConnectorField:
      additionalProperties: false
      properties:
        doc:
          type: string
        kind:
          description: A secret is stored encrypted and never returned.
          enum:
            - text
            - secret
            - int
            - bool
          type: string
        name:
          type: string
        required:
          type: boolean
      required:
        - name
        - kind
        - required
        - doc
      type: object
    ConnectorListOutputBody:
      additionalProperties: false
      properties:
        available:
          items:
            $ref: "#/components/schemas/ConnectorSchema"
          type:
            - array
            - "null"
        items:
          items:
            $ref: "#/components/schemas/ConnectorSettings"
          type:
            - array
            - "null"
      required:
        - items
        - available
      type: object
    ConnectorSchema:
      additionalProperties: false
      properties:
        adapter:
          type: string
        capability:
          description: "The port this adapter serves: notifications, shipping or search."
          type: string
        display_name:
          type: string
        doc:
          type: string
        fields:
          items:
            $ref: "#/components/schemas/ConnectorField"
          type:
            - array
            - "null"
        store_scoped:
          description: Whether a store may hold its own settings, or only the platform.
          type: boolean
      required:
        - adapter
        - capability
        - display_name
        - doc
        - store_scoped
        - fields
      type: object
    ConnectorSchemaOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ConnectorSchema"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    ConnectorSettings:
      additionalProperties: false
      properties:
        adapter:
          type: string
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        enabled:
          type: boolean
        health:
          enum:
            - unknown
            - up
            - down
          type: string
        id:
          format: uuid
          type: string
        label:
          type: string
        last_checked_at:
          format: date-time
          type: string
        last_error:
          type: string
        missing:
          description: Required fields still to be filled. A connector missing anything is not used.
          items:
            type: string
          type:
            - array
            - "null"
        secrets_set:
          description: The secret fields that hold a value. Their values are never returned.
          items:
            type: string
          type:
            - array
            - "null"
        settings:
          additionalProperties:
            type: string
          description: The settings that are not secret, as they were registered.
          type: object
        store_id:
          description: Absent for the platform's own settings.
          format: uuid
          type: string
        updated_at:
          format: date-time
          type: string
        updated_by:
          type: string
        usable:
          description: "Whether the platform will build an adapter from these settings: enabled and complete."
          type: boolean
      required:
        - id
        - adapter
        - settings
        - secrets_set
        - enabled
        - usable
        - health
        - created_at
        - created_by
        - updated_at
        - updated_by
      type: object
    Consent:
      additionalProperties: false
      properties:
        buyer_reference:
          type: string
        channel:
          enum:
            - checkout
            - account
            - storefront
            - support
          type: string
        granted_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        purpose:
          enum:
            - marketing
          type: string
        source:
          type: string
        store_id:
          format: uuid
          type: string
        text_version:
          description: Which wording the buyer saw.
          type: string
        withdrawn_at:
          description: A withdrawal ends the permission from then on; it erases nothing.
          format: date-time
          type: string
      required:
        - id
        - store_id
        - buyer_reference
        - purpose
        - text_version
        - channel
        - granted_at
      type: object
    ConsentListOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Consent"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    CreateCellInputBody:
      additionalProperties: false
      properties:
        id:
          description: Cell identifier, such as cell-br-001.
          maxLength: 63
          pattern: ^cell-[a-z0-9]+-[0-9]{3}$
          type: string
        region:
          description: Region the cell serves.
          maxLength: 32
          minLength: 2
          type: string
      required:
        - id
        - region
      type: object
    CreateInputBody:
      additionalProperties: false
      properties:
        account_id:
          format: uuid
          type: string
        country:
          description: ISO 3166-1 alpha-2, upper case.
          maxLength: 2
          minLength: 2
          type: string
        default_currency:
          description: ISO 4217.
          maxLength: 3
          minLength: 3
          type: string
        default_locale:
          description: Canonical BCP 47 tag, such as pt-BR.
          maxLength: 35
          minLength: 2
          type: string
        home_region:
          description: Region whose cells may host the store.
          maxLength: 32
          minLength: 2
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
        timezone:
          description: IANA time zone, such as America/Sao_Paulo.
          maxLength: 64
          minLength: 1
          type: string
      required:
        - account_id
        - name
        - country
        - default_locale
        - timezone
        - default_currency
        - home_region
      type: object
    CreateInputBody1:
      additionalProperties: false
      properties:
        description:
          maxLength: 200
          type: string
        endpoint:
          description: Absolute https URL that receives the deliveries.
          format: uri
          type: string
        event_types:
          items:
            type: string
          maxItems: 50
          minItems: 1
          type:
            - array
            - "null"
      required:
        - endpoint
        - event_types
      type: object
    CreateTemplateInputBody:
      additionalProperties: false
      properties:
        body:
          description: Text with {{snake_case}} placeholders; nothing else is interpreted.
          maxLength: 20000
          minLength: 1
          type: string
        category:
          description: Marketing deliveries are blocked until DEC-PRIV-003 defines consent.
          enum:
            - transactional
            - marketing
          type: string
        channel:
          enum:
            - email
            - sms
            - push
          type: string
        key:
          maxLength: 64
          minLength: 2
          type: string
        locale:
          maxLength: 16
          minLength: 2
          type: string
        subject:
          maxLength: 200
          type: string
      required:
        - key
        - channel
        - category
        - locale
        - body
      type: object
    CredentialToRevoke:
      additionalProperties: false
      properties:
        expires_at:
          description: When the credential would have expired anyway. The entry is swept after it, because an expired token is already refused.
          format: date-time
          type: string
        reason:
          enum:
            - logout
            - compromised
            - rotated
            - access_ended
          type: string
        subject:
          description: Who it was issued to, kept so the revocation can be explained without holding the credential.
          maxLength: 200
          minLength: 1
          type: string
        token_id:
          description: The jti of the credential. Revoking by subject instead would end every session the person has, including the ones nobody doubts.
          maxLength: 200
          minLength: 1
          type: string
      required:
        - token_id
        - subject
        - reason
        - expires_at
      type: object
    DecisionInputBody:
      additionalProperties: false
      properties:
        reason:
          maxLength: 500
          minLength: 3
          type: string
      required:
        - reason
      type: object
    Delivery:
      additionalProperties: false
      properties:
        attempts:
          format: int64
          type: integer
        category:
          type: string
        channel:
          type: string
        created_at:
          format: date-time
          type: string
        history:
          description: Present when reading a single delivery.
          items:
            $ref: "#/components/schemas/DeliveryAttempt"
          type:
            - array
            - "null"
        id:
          format: uuid
          type: string
        last_error:
          type: string
        next_attempt_at:
          format: date-time
          type: string
        provider:
          type: string
        provider_ref:
          type: string
        recipient:
          description: Masked.
          type: string
        status:
          enum:
            - queued
            - sent
            - failed
            - dead_lettered
            - suppressed
          type: string
        store_id:
          format: uuid
          type: string
        template_key:
          type: string
        template_version:
          format: int64
          type: integer
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - store_id
        - template_key
        - template_version
        - channel
        - category
        - recipient
        - status
        - attempts
        - created_at
        - updated_at
      type: object
    DeliveryAttempt:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        error:
          type: string
        number:
          format: int64
          type: integer
        outcome:
          type: string
        provider:
          type: string
        provider_ref:
          type: string
      required:
        - number
        - provider
        - outcome
        - at
      type: object
    DeliveryListOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Delivery"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    Event:
      additionalProperties: false
      properties:
        action:
          type: string
        actor_id:
          type: string
        actor_type:
          type: string
        id:
          format: uuid
          type: string
        occurred_at:
          format: date-time
          type: string
        organization_id:
          format: uuid
          type: string
        outcome:
          enum:
            - succeeded
            - denied
          type: string
        reason:
          type: string
        request_id:
          type: string
        store_id:
          format: uuid
          type: string
        target_id:
          type: string
        target_type:
          type: string
      required:
        - id
        - occurred_at
        - action
        - outcome
        - actor_type
        - actor_id
      type: object
    Export:
      additionalProperties: false
      properties:
        buyer_reference:
          type: string
        complete:
          description: False when some module could not answer; the partial result is still returned.
          type: boolean
        generated_at:
          format: date-time
          type: string
        modules:
          items:
            $ref: "#/components/schemas/ModuleResult"
          type:
            - array
            - "null"
      required:
        - buyer_reference
        - generated_at
        - complete
        - modules
      type: object
    Extension:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        digest:
          type: string
        display_name:
          type: string
        events:
          items:
            type: string
          type:
            - array
            - "null"
        id:
          format: uuid
          type: string
        max_contract:
          type: string
        min_contract:
          type: string
        module_id:
          type: string
        publisher:
          type: string
        reason:
          type: string
        reviewed_by:
          type: string
        scopes:
          items:
            type: string
          type:
            - array
            - "null"
        status:
          enum:
            - submitted
            - approved
            - rejected
            - suspended
          type: string
        updated_at:
          format: date-time
          type: string
        version:
          type: string
        webhook_endpoint:
          type: string
      required:
        - id
        - module_id
        - publisher
        - display_name
        - version
        - min_contract
        - max_contract
        - scopes
        - events
        - webhook_endpoint
        - digest
        - status
        - created_at
        - updated_at
      type: object
    FieldError:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, such as body.name or query.limit.
          type: string
        message:
          description: Human-readable explanation.
          type: string
      required:
        - message
      type: object
    GrantBody:
      additionalProperties: false
      properties:
        permissions:
          description: Permissions granted directly, for what no role covers.
          items:
            type: string
          maxItems: 200
          type:
            - array
            - "null"
        reach:
          description: "How far an organization membership reaches: its node (default), every store, or the listed ones."
          enum:
            - node
            - all_stores
            - listed
          type: string
        reach_stores:
          description: Stores reached, for a listed reach.
          items:
            format: uuid
            type: string
          maxItems: 200
          type:
            - array
            - "null"
        roles:
          description: Default or custom roles of this node.
          items:
            type: string
          maxItems: 50
          type:
            - array
            - "null"
        subject:
          description: Subject of the user at the identity provider.
          maxLength: 255
          minLength: 1
          type: string
      required:
        - subject
      type: object
    GrantInputBody:
      additionalProperties: false
      properties:
        buyer_reference:
          maxLength: 200
          minLength: 1
          type: string
        channel:
          enum:
            - checkout
            - account
            - storefront
            - support
          type: string
        purpose:
          description: Only a purpose that rests on consent can be consented to.
          enum:
            - marketing
          type: string
        source:
          maxLength: 200
          type: string
        text_version:
          description: Which wording the buyer saw.
          maxLength: 64
          minLength: 1
          type: string
      required:
        - buyer_reference
        - purpose
        - text_version
        - channel
      type: object
    GrantOutputBody:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        granted_by:
          type: string
        key:
          type: string
        reason:
          type: string
        store_id:
          format: uuid
          type: string
      required:
        - key
        - store_id
        - reason
        - granted_by
        - created_at
      type: object
    GrantPolicyInputBody:
      additionalProperties: false
      properties:
        reason:
          maxLength: 500
          minLength: 1
          type: string
      required:
        - reason
      type: object
    HoldListOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/LegalHold"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    Hostname:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        hostname:
          type: string
        id:
          format: uuid
          type: string
        kind:
          enum:
            - subdomain
            - custom
          type: string
        last_checked_at:
          description: Possession is re-checked, not assumed.
          format: date-time
          type: string
        serving:
          description: Whether the edge answers on this name.
          type: boolean
        state:
          enum:
            - pending_verification
            - verified
            - active
            - failing
            - suspended
            - removed
          type: string
        store_id:
          format: uuid
          type: string
        verification_token:
          description: Publish as a TXT record on _sellvex-challenge.<domain>.
          type: string
        verification_token_expires_at:
          format: date-time
          type: string
        verified_at:
          format: date-time
          type: string
      required:
        - id
        - store_id
        - hostname
        - kind
        - state
        - serving
        - created_at
      type: object
    HostnameListOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Hostname"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    ImpersonationSession:
      additionalProperties: false
      properties:
        ended_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        operator_id:
          type: string
        reason:
          type: string
        started_at:
          format: date-time
          type: string
        store_id:
          format: uuid
          type: string
      required:
        - id
        - operator_id
        - store_id
        - reason
        - started_at
        - expires_at
      type: object
    JobAttempt:
      additionalProperties: false
      properties:
        attempt:
          format: int64
          type: integer
        detail:
          type: string
        finished_at:
          format: date-time
          type: string
        outcome:
          enum:
            - started
            - succeeded
            - failed
            - abandoned
            - cancelled
          type: string
        runner:
          type: string
        started_at:
          format: date-time
          type: string
      required:
        - attempt
        - outcome
        - runner
        - started_at
      type: object
    KillInputBody:
      additionalProperties: false
      properties:
        reason:
          maxLength: 500
          minLength: 5
          type: string
      required:
        - reason
      type: object
    LegalHold:
      additionalProperties: false
      properties:
        applied_at:
          format: date-time
          type: string
