components:
  schemas:
    Address:
      additionalProperties: false
      properties:
        country:
          description: ISO 3166-1 alpha-2.
          maxLength: 2
          minLength: 2
          type: string
        line1:
          maxLength: 200
          minLength: 1
          type: string
        line2:
          maxLength: 200
          type: string
        locality:
          maxLength: 200
          minLength: 1
          type: string
        postal_code:
          maxLength: 200
          minLength: 1
          type: string
        recipient:
          maxLength: 200
          type: string
        region:
          maxLength: 200
          type: string
      required:
        - country
        - postal_code
        - locality
        - line1
      type: object
    AdjustmentEntry:
      additionalProperties: false
      properties:
        account_id:
          description: Account to post to. It must belong to this organization.
          format: uuid
          type: string
        amount:
          description: Minor units of the currency, always positive. The direction carries the sign.
          format: int64
          minimum: 1
          type: integer
        currency:
          description: ISO 4217, uppercase.
          maxLength: 3
          minLength: 3
          type: string
        direction:
          enum:
            - debit
            - credit
          type: string
      required:
        - account_id
        - direction
        - amount
        - currency
      type: object
    AdjustmentInputBody:
      additionalProperties: false
      properties:
        approval_id:
          description: "The approval a second operator granted for this adjustment. It is claimed once: a retry of the same adjustment returns the transaction already posted, but a different adjustment cannot reuse it."
          format: uuid
          type: string
        entries:
          description: The correction and its counterpart. Both directions must be present and the whole must balance.
          items:
            $ref: "#/components/schemas/AdjustmentEntry"
          minItems: 2
          type:
            - array
            - "null"
        reason:
          description: "Why the books needed correcting. This sentence is the whole record of it: an adjustment has no upstream fact behind it."
          maxLength: 500
          minLength: 20
          type: string
      required:
        - approval_id
        - reason
        - entries
      type: object
    Balance:
      additionalProperties: false
      properties:
        currency:
          type: string
        fees:
          description: What the provider kept from what it paid.
          format: int64
          type: integer
        pending:
          description: Net of what is scheduled and has not moved.
          format: int64
          type: integer
        reversed:
          description: Net of what was undone after the fact.
          format: int64
          type: integer
        settled:
          description: Net of everything the provider paid out.
          format: int64
          type: integer
      required:
        - currency
        - settled
        - pending
        - fees
        - reversed
      type: object
    BalanceCheck:
      additionalProperties: false
      properties:
        account_id:
          format: uuid
          type: string
        diverged:
          description: Whether the materialised balance disagrees with the entries
          type: boolean
        from_entries:
          description: The sum of the entries, in minor units
          format: int64
          type: integer
        projected:
          description: The materialised balance, in minor units
          format: int64
          type: integer
      required:
        - account_id
        - diverged
      type: object
    BalanceOutputBody:
      additionalProperties: false
      properties:
        from:
          format: date-time
          type: string
        items:
          items:
            $ref: "#/components/schemas/Balance"
          type:
            - array
            - "null"
        to:
          format: date-time
          type: string
      required:
        - from
        - to
        - items
      type: object
    CancelInputBody:
      additionalProperties: false
      properties:
        reason:
          description: Why the order is being cancelled; recorded in the history with whoever cancelled.
          maxLength: 500
          minLength: 3
          type: string
      required:
        - reason
      type: object
    CaptureInputBody:
      additionalProperties: false
      properties:
        amount:
          description: Minor units; partial captures are allowed.
          format: int64
          maximum: 9007199254740991
          minimum: 1
          type: integer
      required:
        - amount
      type: object
    Chargeback:
      additionalProperties: false
      properties:
        acquirer_code:
          description: The reason code the issuer gave, in the acquirer's own taxonomy.
          type: string
        amount:
          format: int64
          type: integer
        bearer:
          description: "Who absorbs the amount while the dispute runs. Not a ruling: the issuer decides the outcome."
          enum:
            - store
            - platform
            - undecided
          type: string
        cause:
          enum:
            - fraud_with_proof_of_delivery
            - product_not_delivered
            - product_not_as_described
            - unrecognised_without_delivery
            - unclassified
          type: string
        contestable_until:
          description: The acquirer's deadline to dispute.
          format: date-time
          type: string
        currency:
          type: string
        delivery_proven:
          description: Whether a carrier-tracked delivery existed when it was attributed.
          type: boolean
        id:
          format: uuid
          type: string
        opened_at:
          format: date-time
          type: string
        payment_id:
          format: uuid
          type: string
        provider:
          type: string
        recorded_at:
          format: date-time
          type: string
        reference:
          description: The acquirer's own id for the dispute.
          type: string
        status:
          enum:
            - open
            - contested
            - won
            - lost
            - accepted
          type: string
        store_id:
          format: uuid
          type: string
      required:
        - id
        - store_id
        - payment_id
        - provider
        - reference
        - cause
        - bearer
        - delivery_proven
        - currency
        - amount
        - status
        - contestable_until
        - opened_at
        - recorded_at
      type: object
    CheckResult:
      additionalProperties: false
      properties:
        duration_ms:
          description: Probe duration in milliseconds.
          format: int64
          minimum: 0
          type: integer
        name:
          description: Dependency name.
          type: string
        status:
          description: Probe outcome.
          enum:
            - up
            - down
          type: string
      required:
        - name
        - status
        - duration_ms
      type: object
    Checkout:
      additionalProperties: false
      properties:
        cart_id:
          format: uuid
          type: string
        created_at:
          format: date-time
          type: string
        failure_code:
          type: string
        id:
          format: uuid
          type: string
        marketplace_order_id:
          format: uuid
          type: string
        payment_id:
          format: uuid
          type: string
        reservation_id:
          format: uuid
          type: string
        shipping_included:
          type: boolean
        status:
          description: payment_pending waits for the provider; read it again or call resume.
          enum:
            - running
            - payment_pending
            - completed
            - failed
          type: string
        step:
          type: string
        steps:
          description: Present when reading a checkout.
          items:
            $ref: "#/components/schemas/Step"
          type:
            - array
            - "null"
        store_id:
          format: uuid
          type: string
        taxes_included:
          type: boolean
        total_amount:
          description: Items only, in minor units. Taxes (DEC-TAX-001) and shipping are not calculated yet.
          format: int64
          type: integer
        total_currency:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - store_id
        - cart_id
        - status
        - step
        - taxes_included
        - shipping_included
        - created_at
        - updated_at
      type: object
    ClassifyInputBody:
      additionalProperties: false
      properties:
        cause:
          enum:
            - fraud_with_proof_of_delivery
            - product_not_delivered
            - product_not_as_described
            - unrecognised_without_delivery
          type: string
      required:
        - cause
      type: object
    Commission:
      additionalProperties: false
      properties:
        amount:
          format: int64
          type: integer
        base_amount:
          description: Value of the products after discounts, excluding shipping and taxes, in minor units.
          format: int64
          type: integer
        calculated_at:
          format: date-time
          type: string
        considered:
          items:
            $ref: "#/components/schemas/ConsideredRule"
          type:
            - array
            - "null"
        currency:
          type: string
        detail:
          type: string
        rate_ppm:
          format: int64
          type: integer
        rate_scale:
          format: int64
          type: integer
        rounding:
          type: string
        rule_id:
          format: uuid
          type: string
        rule_version:
          format: int64
          type: integer
        sale_at:
          format: date-time
          type: string
        seller_order_id:
          description: Absent on a quote.
          format: uuid
          type: string
        status:
          description: "undefined: no rule applies (DEC-COM-001); ambiguous: two rules fix the same dimensions for this sale (DEC-COM-002)."
          enum:
            - calculated
            - undefined
            - ambiguous
          type: string
        store_id:
          format: uuid
          type: string
        version:
          format: int64
          type: integer
        winning_dimension:
          type: string
      required:
        - store_id
        - status
        - base_amount
        - currency
        - rate_ppm
        - rate_scale
        - amount
        - rounding
        - considered
        - sale_at
        - calculated_at
        - version
      type: object
    CommissionRule:
      additionalProperties: false
      properties:
        category_id:
          format: uuid
          type: string
        channel_id:
          format: uuid
          type: string
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        dimensions:
          description: "What the rule fixes: global, store, category, channel or a combination joined by +."
          type: string
        id:
          format: uuid
          type: string
        rate_ppm:
          description: "Rate in parts per million: 125000 is 12.5%."
          format: int64
          type: integer
        rate_scale:
          format: int64
          type: integer
        reason:
          type: string
        retired_at:
          format: date-time
          type: string
        retired_by:
          type: string
        status:
          enum:
            - active
            - retired
          type: string
        store_id:
          format: uuid
          type: string
        valid_from:
          format: date-time
          type: string
        valid_until:
          format: date-time
          type: string
        version:
          format: int64
          type: integer
        weight:
          description: "Precedence of DEC-COM-002: store 4, category 2, channel 1; the highest applicable weight wins."
          format: int64
          type: integer
      required:
        - id
        - dimensions
        - weight
        - rate_ppm
        - rate_scale
        - valid_from
        - status
        - reason
        - version
        - created_at
        - created_by
      type: object
    CommissionsDay:
      additionalProperties: false
      properties:
        base_amount:
          format: int64
          type: integer
        calculated_count:
          format: int64
          type: integer
        commission_amount:
          format: int64
          type: integer
        currency:
          type: string
        day:
          type: string
        undefined_count:
          description: Orders whose commission was undefined or ambiguous when placed.
          format: int64
          type: integer
      required:
        - day
        - currency
        - calculated_count
        - undefined_count
        - base_amount
        - commission_amount
      type: object
    CommissionsOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/CommissionsDay"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    ConsideredRule:
      additionalProperties: false
      properties:
        applies:
          type: boolean
        dimensions:
          type: string
        rate_ppm:
          format: int64
          type: integer
        rule_id:
          format: uuid
          type: string
        version:
          format: int64
          type: integer
        weight:
          format: int64
          type: integer
      required:
        - rule_id
        - version
        - dimensions
        - weight
        - rate_ppm
        - applies
      type: object
    Credential:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        id:
          format: uuid
          type: string
        key_id:
          description: The encryption key it is sealed with, for rotation. Not a secret.
          type: string
        label:
          description: What the operator recognises the credential by; never a secret.
          type: string
        provider:
          type: string
        store_id:
          description: Absent on the platform's own credential.
          format: uuid
          type: string
      required:
        - id
        - provider
        - key_id
        - created_at
        - created_by
      type: object
    CredentialBody:
      additionalProperties: false
      properties:
        label:
          description: What to recognise this credential by.
          maxLength: 100
          type: string
        secret:
          description: The provider key or token. Stored encrypted and never returned.
          maxLength: 4096
          minLength: 1
          type: string
      required:
        - secret
      type: object
    CredentialListOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Credential"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    DecideInputBody:
      additionalProperties: false
      properties:
        approve:
          type: boolean
        note:
          description: Required to refuse.
          maxLength: 500
          type: string
      required:
        - approve
      type: object
    DismissInputBody:
      additionalProperties: false
      properties:
        reason:
          description: Why the divergence is acceptable. Recorded with the actor.
          maxLength: 500
          minLength: 3
          type: string
      required:
        - reason
      type: object
    DownloadOutputBody:
      additionalProperties: false
      properties:
        expires_in:
          type: string
        job_id:
          format: uuid
          type: string
        url:
          description: Signed, short-lived.
          type: string
      required:
        - url
        - expires_in
        - job_id
      type: object
    ExportInputBody:
      additionalProperties: false
      properties:
        from:
          format: date-time
          type: string
        report:
          enum:
            - sales
            - commissions
            - shipments
          type: string
        to:
          format: date-time
          type: string
      required:
        - report
        - from
        - to
      type: object
    ExportOutputBody:
      additionalProperties: false
      properties:
        job_id:
          description: Follow it on the jobs API; download here once it succeeded.
          format: uuid
          type: string
      required:
        - job_id
      type: object
    FieldError:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, such as body.name or query.limit.
          type: string
        message:
          description: Human-readable explanation.
          type: string
      required:
        - message
      type: object
    FiscalDocument:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        currency:
          type: string
        id:
          format: uuid
          type: string
        issued_at:
          format: date-time
          type: string
        issuer:
          type: string
        kind:
          type: string
        number:
          type: string
        provider_ref:
          type: string
        reason:
          type: string
        seller_order_id:
          format: uuid
          type: string
        series:
          type: string
        status:
          type: string
        total_amount:
          format: int64
          type: integer
      required:
        - id
        - seller_order_id
        - kind
        - issuer
        - status
        - currency
        - total_amount
        - created_at
      type: object
    Item:
      additionalProperties: false
      properties:
        discount_amount:
          description: What promotions took off the line.
          format: int64
          type: integer
        line_no:
          format: int64
          type: integer
        line_total_amount:
          description: Unit price times quantity minus the discount.
          format: int64
          type: integer
        line_total_currency:
          type: string
        price_list_id:
          format: uuid
          type: string
        price_list_version:
          format: int64
          type: integer
        quantity:
          format: int64
          type: integer
        sku:
          type: string
        title:
          type: string
        unit_price_amount:
          format: int64
          type: integer
        unit_price_currency:
          type: string
        variant_id:
          format: uuid
          type: string
      required:
        - line_no
        - variant_id
        - sku
        - title
        - quantity
        - unit_price_amount
        - unit_price_currency
        - discount_amount
        - line_total_amount
        - line_total_currency
        - price_list_id
        - price_list_version
      type: object
    Item1:
      additionalProperties: false
      properties:
        line_no:
          format: int64
          minimum: 1
          type: integer
        quantity:
          format: int64
          minimum: 1
          type: integer
      required:
        - line_no
        - quantity
      type: object
    Item2:
      additionalProperties: false
      properties:
        condition:
          maxLength: 200
          type: string
        line_no:
          format: int64
          minimum: 1
          type: integer
        quantity:
          format: int64
          minimum: 0
          type: integer
      required:
        - line_no
        - quantity
      type: object
    LedgerAccount:
      additionalProperties: false
      properties:
        code:
          type: string
        created_at:
          format: date-time
          type: string
        currency:
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        nature:
          enum:
            - asset
            - liability
            - equity
            - revenue
            - expense
          type: string
        organization_id:
          format: uuid
          type: string
        status:
          enum:
            - open
            - closed
          type: string
        store_id:
          format: uuid
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - organization_id
        - code
        - name
        - nature
        - currency
        - status
        - created_at
        - updated_at
      type: object
    LedgerBalance:
      additionalProperties: false
      properties:
        account_id:
          format: uuid
          type: string
        amount:
          format: int64
          type: integer
        code:
          type: string
        currency:
          type: string
      required:
        - account_id
        - code
        - amount
        - currency
      type: object
    LedgerEntry:
      additionalProperties: false
      properties:
        account_id:
          format: uuid
          type: string
        amount:
          format: int64
          type: integer
        currency:
          type: string
        direction:
          enum:
            - debit
            - credit
          type: string
      required:
        - account_id
        - direction
        - amount
        - currency
      type: object
    LedgerTransaction:
      additionalProperties: false
      properties:
        corrects:
          format: uuid
          type: string
        currency:
          type: string
        entries:
          description: Present when reading a single transaction.
          items:
            $ref: "#/components/schemas/LedgerEntry"
          type:
            - array
            - "null"
        id:
          format: uuid
          type: string
        memo:
          type: string
        occurred_at:
          format: date-time
          type: string
        organization_id:
          format: uuid
          type: string
        recorded_at:
          format: date-time
          type: string
        rule_id:
          type: string
        rule_version:
          format: int64
          type: integer
        source_id:
          type: string
        source_type:
          type: string
        store_id:
          format: uuid
          type: string
      required:
        - id
        - organization_id
        - currency
        - rule_id
        - rule_version
        - source_type
        - source_id
        - occurred_at
        - recorded_at
      type: object
    ListAccountsOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/LedgerAccount"
          type:
            - array
            - "null"
        next:
          type: string
      required:
        - items
      type: object
    ListBalancesOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/LedgerBalance"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    ListOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/SellerOrder"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    ListOutputBody1:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ReconciliationCase"
          type:
            - array
            - "null"
        next:
          type: string
      required:
        - items
      type: object
    ListOutputBody2:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/CommissionRule"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    ListOutputBody3:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Shipment"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    ListOutputBody4:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Settlement"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    ListOutputBody5:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Chargeback"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    ListOutputBody6:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ReturnRequest"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    ListOutputBody7:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/FiscalDocument"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    ListTransactionsOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/LedgerTransaction"
          type:
            - array
            - "null"
        next:
          type: string
      required:
        - items
      type: object
    LivenessOutputBody:
      additionalProperties: false
      properties:
        status:
          description: Always ok while the process can serve requests.
          enum:
            - ok
          type: string
      required:
        - status
      type: object
    MyPurchasesOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/SellerOrder"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    OpenAccountInputBody:
      additionalProperties: false
      properties:
        code:
          description: One of the six accounts DEC-FIN-004 approved. An arbitrary code would be an account no posting rule knows about and no report includes.
          enum:
            - receivable
            - payable_store
            - commission_income
            - gateway_fee
            - refund
            - adjustment
          type: string
        currency:
          description: ISO 4217, uppercase. Accounts are per currency.
          maxLength: 3
          minLength: 3
          type: string
      required:
        - code
        - currency
      type: object
    OpenInputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Item1"
          maxItems: 100
          minItems: 1
          type:
            - array
            - "null"
        payment_id:
          description: The payment a refund would be issued against; without it the refund step is refused.
          format: uuid
          type: string
        reason:
          maxLength: 500
          minLength: 3
          type: string
        seller_order_id:
          format: uuid
          type: string
      required:
        - seller_order_id
        - reason
        - items
      type: object
    Operation:
      additionalProperties: false
      properties:
        amount:
